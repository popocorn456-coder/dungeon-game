<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Scanner: Protocol X</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap');

        :root {
            --radar-green: #00ff41;
            --radar-dark: #002200;
            --alert-red: #ff003c;
            --cyan: #00e5ff;
            --bg-color: #020a04;
        }

        body {
            margin: 0; background: var(--bg-color); color: var(--radar-green);
            font-family: 'Noto Sans TC', 'Orbitron', sans-serif;
            overflow: hidden; user-select: none;
        }

        /* CRT 掃描線濾鏡 */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none; z-index: 50;
        }

        /* 遊戲畫布 */
        #radar-canvas {
            width: 100vw; height: 100vh; display: block;
        }

        /* HUD 狀態列 */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; display: flex;
            justify-content: space-between; padding: 25px 40px; box-sizing: border-box;
            pointer-events: none; z-index: 10;
        }

        .hud-panel {
            background: rgba(0, 30, 0, 0.7); border: 1px solid var(--radar-green);
            padding: 10px 20px; border-radius: 4px; box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
        }
        
        .stat-label { font-family: 'Orbitron'; font-size: 0.9em; opacity: 0.8; }
        .stat-val { font-weight: bold; font-size: 1.8em; text-shadow: 0 0 8px var(--radar-green); }
        #hp.danger { color: var(--alert-red); text-shadow: 0 0 8px var(--alert-red); }

        /* 題目顯示區 */
        #terminal-box {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 800px; text-align: center;
            pointer-events: none; z-index: 10;
        }

        .term-header {
            font-family: 'Orbitron'; font-size: 1em; color: var(--cyan);
            letter-spacing: 2px; margin-bottom: 10px; text-shadow: 0 0 5px var(--cyan);
        }

        #q-content {
            font-size: 1.5em; line-height: 1.6; font-weight: bold;
            background: rgba(0, 15, 0, 0.85); border-left: 4px solid var(--cyan);
            border-right: 4px solid var(--cyan); padding: 15px 30px;
            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.1);
        }

        /* 系統錯誤 (Glitch) 特效 */
        body.glitch-active { animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite; }
        body.glitch-active #radar-canvas { filter: hue-rotate(90deg) contrast(200%) invert(1); }

        @keyframes glitch-skew {
            0% { transform: translate(0) }
            20% { transform: translate(-5px, 5px) }
            40% { transform: translate(-5px, -5px) }
            60% { transform: translate(5px, 5px) }
            80% { transform: translate(5px, -5px) }
            100% { transform: translate(0) }
        }

        /* 啟動選單 */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #010a02; z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }

        .title { font-family: 'Orbitron'; color: var(--radar-green); font-size: 4em; letter-spacing: 5px; text-shadow: 0 0 20px var(--radar-green); margin: 0; }
        .subtitle { color: var(--cyan); font-size: 1.2em; margin-bottom: 40px; letter-spacing: 2px; }
        
        button {
            background: rgba(0, 255, 65, 0.1); border: 2px solid var(--radar-green);
            color: var(--radar-green); padding: 15px 40px; font-size: 1.5em;
            cursor: pointer; font-family: 'Orbitron', 'Noto Sans TC';
            transition: all 0.3s; text-transform: uppercase;
        }
        button:hover { background: var(--radar-green); color: black; box-shadow: 0 0 20px var(--radar-green); }

    </style>
</head>

    // --- 雷達遊戲引擎 ---
    const canvas = document.getElementById('radar-canvas');
    const ctx = canvas.getContext('2d');
    
    let state = {
        hp: 100, step: 0, goal: 20, active: false,
        isResolving: false, radarAngle: 0, currentQ: null
    };

    let blips = [];     // 儲存選項光點
    let particles = []; // 儲存爆炸粒子
    let cx, cy, radarRadius;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        cx = canvas.width / 2;
        cy = canvas.height / 2;
        radarRadius = Math.min(cx, cy) * 0.75; // 雷達範圍
    }
    window.addEventListener('resize', resize);
    resize();

    function initGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('terminal-box').style.display = 'block';
        state.active = true;
        state.hp = 100;
        state.step = 0;
        updateUI();
        nextQuestion();
        requestAnimationFrame(gameLoop);
    }

    // 主繪製迴圈
    function gameLoop() {
        if (!state.active) return;

        // 製造雷達掃描殘影 (半透明覆蓋)
        ctx.fillStyle = 'rgba(2, 10, 4, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawRadarGrid();
        drawSweepingLine();
        drawBlips();
        updateAndDrawParticles();

        state.radarAngle += 0.03; // 雷達旋轉速度
        requestAnimationFrame(gameLoop);
    }

    function drawRadarGrid() {
        ctx.strokeStyle = 'rgba(0, 255, 65, 0.3)';
        ctx.lineWidth = 1;
        
        // 同心圓
        for(let i=1; i<=3; i++) {
            ctx.beginPath();
            ctx.arc(cx, cy, radarRadius * (i/3), 0, Math.PI * 2);
            ctx.stroke();
        }

        // 十字線
        ctx.beginPath();
        ctx.moveTo(cx, cy - radarRadius); ctx.lineTo(cx, cy + radarRadius);
        ctx.moveTo(cx - radarRadius, cy); ctx.lineTo(cx + radarRadius, cy);
        ctx.stroke();
    }

    function drawSweepingLine() {
        const endX = cx + Math.cos(state.radarAngle) * radarRadius;
        const endY = cy + Math.sin(state.radarAngle) * radarRadius;
        
        // 掃描光束
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(endX, endY);
        ctx.strokeStyle = '#00ff41';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ff41';
        ctx.stroke();
        ctx.shadowBlur = 0; // 重置
    }

    function drawBlips() {
        blips.forEach(blip => {
            if(blip.hidden) return;

            // 讓光點稍微閃爍 (呼吸燈)
            const pulse = 1 + Math.sin(Date.now() / 200 + blip.index) * 0.2;
            const size = blip.radius * pulse;

            // 繪製光點
            ctx.beginPath();
            ctx.arc(blip.x, blip.y, size, 0, Math.PI * 2);
            ctx.fillStyle = state.isResolving && blip.isCorrect ? '#00e5ff' : '#00ff41';
            ctx.fill();

            // 繪製選項文字
            ctx.font = '16px "Noto Sans TC", sans-serif';
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 替文字加個半透明底色確保可讀性
            const textWidth = ctx.measureText(blip.text).width;
            ctx.fillStyle = 'rgba(0, 20, 0, 0.8)';
            ctx.fillRect(blip.x - textWidth/2 - 5, blip.y + 15, textWidth + 10, 24);

            ctx.fillStyle = state.isResolving && blip.isCorrect ? '#00e5ff' : '#00ff41';
            ctx.fillText(blip.text, blip.x, blip.y + 27);
        });
    }

    function nextQuestion() {
        state.isResolving = false;
        blips = [];
        const q = rawQuestions[Math.floor(Math.random() * rawQuestions.length)];
        state.currentQ = q;

        // 打字機特效顯示題目
        const qBox = document.getElementById('q-content');
        qBox.innerText = "";
        let i = 0;
        const typeWriter = setInterval(() => {
            qBox.innerText += q.q.charAt(i);
            i++;
            if(i >= q.q.length) clearInterval(typeWriter);
        }, 30);

        // 將 3 個選項散佈在雷達的三個方位
        const baseAngles = [Math.PI/6, 5*Math.PI/6, 3*Math.PI/2]; // 大約散開
        
        q.a.forEach((ans, idx) => {
            const dist = radarRadius * (0.4 + Math.random() * 0.4); // 距離中心 40%~80%
            const angle = baseAngles[idx] + (Math.random() - 0.5) * 0.8; // 增加隨機偏移
            
            blips.push({
                x: cx + Math.cos(angle) * dist,
                y: cy + Math.sin(angle) * dist,
                text: ans,
                radius: 12, // 判定半徑
                index: idx,
                hidden: false,
                isCorrect: (idx === q.correct)
            });
        });
    }

    // --- 互動與判定 ---
    // 滑鼠游標變化
    canvas.addEventListener('mousemove', (e) => {
        if (!state.active || state.isResolving) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        
        let hovered = blips.some(b => !b.hidden && Math.hypot(mx - b.x, my - b.y) < b.radius * 2.5);
        canvas.style.cursor = hovered ? 'crosshair' : 'default';
    });

    // 點擊判定
    canvas.addEventListener('click', (e) => {
        if (!state.active || state.isResolving) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        // 擴大一點點擊判定區 (半徑 * 2.5)
        const clickedBlip = blips.find(b => !b.hidden && Math.hypot(mx - b.x, my - b.y) < b.radius * 2.5);
        
        if (clickedBlip) {
            handleChoice(clickedBlip);
        }
    });

    function handleChoice(blip) {
        state.isResolving = true;
        canvas.style.cursor = 'default';

        if (blip.isCorrect) {
            // 答對：產生藍綠色資料解析特效
            spawnParticles(blip.x, blip.y, '#00e5ff', 30);
            
            // 隱藏其他錯誤光點
            blips.forEach(b => { if(!b.isCorrect) b.hidden = true; });

            state.step++;
            updateUI();
            
            if (state.step >= state.goal) {
                setTimeout(() => endGame(true), 1500);
            } else {
                setTimeout(nextQuestion, 1200);
            }
        } else {
            // 答錯：引發系統干擾
            state.hp -= 20;
            spawnParticles(blip.x, blip.y, '#ff003c', 40);
            blip.hidden = true; // 點破該錯誤光點
            
            triggerGlitch();
            updateUI();

            if (state.hp <= 0) {
                setTimeout(() => endGame(false), 1000);
            } else {
                // 提示正確答案後繼續
                const qBox = document.getElementById('q-content');
                qBox.innerHTML = `<span style="color:var(--alert-red);">[連線錯誤]</span> 正確訊號應為：${state.currentQ.a[state.currentQ.correct]}`;
                setTimeout(nextQuestion, 2000);
            }
        }
    }

    // --- 特效與狀態管理 ---
    function triggerGlitch() {
        document.body.classList.add('glitch-active');
        setTimeout(() => document.body.classList.remove('glitch-active'), 400);
    }

    function spawnParticles(x, y, color, amount) {
        for(let i=0; i<amount; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12,
                life: 1.0, color: color
            });
        }
    }

    function updateAndDrawParticles() {
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.03; // 衰減速度

            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
            ctx.fill();

            if(p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1.0;
    }

    function updateUI() {
        const hpEl = document.getElementById('hp');
        hpEl.innerText = state.hp + "%";
        if(state.hp <= 40) hpEl.classList.add('danger');
        else hpEl.classList.remove('danger');

        document.getElementById('progress').innerText = state.step;
    }

    function endGame(win) {
        state.active = false;
        document.getElementById('hud').style.display = 'none';
        document.getElementById('terminal-box').style.display = 'none';
        
        const screen = document.getElementById('start-screen');
        screen.style.display = 'flex';
        
        if(win) {
            screen.innerHTML = `
                <h1 class="title" style="color:var(--cyan); text-shadow:0 0 20px var(--cyan);">DATA RETRIEVED</h1>
                <p class="subtitle" style="color:var(--radar-green);">掃描完成，系統防護正常。</p>
                <button onclick="location.reload()" style="border-color:var(--cyan); color:var(--cyan);">重新啟動掃描</button>`;
        } else {
            screen.innerHTML = `
                <h1 class="title" style="color:var(--alert-red); text-shadow:0 0 20px var(--alert-red);">SYSTEM FAILURE</h1>
                <p class="subtitle" style="color:gray;">生命跡象中斷，資料損毀。</p>
                <button onclick="location.reload()" style="border-color:var(--alert-red); color:var(--alert-red);">重啟急救協議</button>`;
        }
    }
</script>

</body>
</html>
